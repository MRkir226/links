<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECRETSMON | Links</title>
    <meta property="og:title" content="SECRETSMON">
    <meta property="og:description" content="Web & IoT Developer">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            color: #fff;
            position: relative;
        }

        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #0a0a1a, #1a0a2e, #0a1a2e, #0a0a1a);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            z-index: -2;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: -1;
            animation: float 20s ease-in-out infinite;
        }

        .blob-1 { width: 400px; height: 400px; background: #7832ff; top: -100px; left: -100px; }
        .blob-2 { width: 500px; height: 500px; background: #00c8ff; bottom: -150px; right: -150px; animation-delay: -5s; }
        .blob-3 { width: 300px; height: 300px; background: #ff0080; top: 50%; left: 50%; animation-delay: -10s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-30px, 30px) scale(0.9); }
        }

        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 420px;
            width: 100%;
            text-align: center;
            animation: fadeIn 1s ease-out;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px rgba(120, 50, 255, 0.5);
            animation: pulse 3s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.3s ease;
            background: linear-gradient(135deg, #7832ff 0%, #00c8ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
        }

        .avatar:hover { transform: scale(1.1) rotate(5deg); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 40px rgba(120, 50, 255, 0.5); }
            50% { box-shadow: 0 0 60px rgba(120, 50, 255, 0.8), 0 0 80px rgba(0, 200, 255, 0.4); }
        }

        h1 {
            font-size: 32px;
            margin-bottom: 8px;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #fff 0%, #a78bfa 50%, #00c8ff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }

        @keyframes shine { to { background-position: 200% center; } }

        .subtitle { color: #888; font-size: 14px; margin-bottom: 35px; letter-spacing: 1px; }

        .links { display: flex; flex-direction: column; gap: 14px; }

        .link {
            display: flex;
            align-items: center;
            padding: 18px 22px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(120, 50, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .link:hover::before { left: 100%; }
        .link:hover {
            background: rgba(120, 50, 255, 0.15);
            border-color: #7832ff;
            transform: translateX(8px) scale(1.02);
            box-shadow: 0 10px 30px rgba(120, 50, 255, 0.4);
        }

        .link svg { width: 26px; height: 26px; margin-right: 15px; flex-shrink: 0; transition: transform 0.3s ease; }
        .link:hover svg { transform: scale(1.2) rotate(-5deg); }
        .link-text { flex: 1; text-align: left; }
        .link-name { font-weight: 600; font-size: 16px; }
        .link-username { font-size: 12px; color: #888; margin-top: 3px; }
        .arrow { color: #555; font-size: 20px; transition: all 0.3s ease; }
        .link:hover .arrow { color: #7832ff; transform: translateX(5px); }

        /* Мини-игры секция */
        .games-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .games-title {
            font-size: 18px;
            margin-bottom: 20px;
            color: #a78bfa;
            letter-spacing: 2px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .game-btn {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 600;
        }

        .game-btn:hover {
            background: rgba(120, 50, 255, 0.2);
            border-color: #7832ff;
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(120, 50, 255, 0.4);
        }

        /* Модальное окно для игр */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: rgba(20, 20, 30, 0.95);
            border: 1px solid rgba(120, 50, 255, 0.3);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(20px);
        }

        .modal-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #a78bfa;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            color: #fff;
            cursor: pointer;
            background: none;
            border: none;
        }

        /* Игра: Кликер */
        .clicker-display {
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
            color: #00c8ff;
        }

        .clicker-btn {
            padding: 20px 40px;
            font-size: 18px;
            background: linear-gradient(135deg, #7832ff 0%, #00c8ff 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .clicker-btn:active { transform: scale(0.95); }

        /* Игра: Угадай число */
        .guess-input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            margin: 15px 0;
            text-align: center;
        }

        .guess-btn {
            padding: 12px 30px;
            font-size: 16px;
            background: #7832ff;
            border: none;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            margin: 5px;
        }

        .guess-message {
            margin-top: 15px;
            font-size: 16px;
            min-height: 24px;
        }

        .footer { margin-top: 35px; font-size: 12px; color: #555; letter-spacing: 1px; }
        .counter { margin-top: 20px; font-size: 11px; color: #444; }
        .counter span { color: #7832ff; font-weight: bold; }
    </style>
</head>

    <!-- Модальное окно для игр -->
    <div class="modal" id="gameModal">
        <button class="modal-close" onclick="closeGame()">×</button>
        <div class="modal-content" id="gameContent"></div>
    </div>

    <script>
        // Частицы
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const particleCount = 50;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = `rgba(120, 50, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Счетчик кликов
        let clicks = parseInt(localStorage.getItem('clicks') || '0');
        document.getElementById('clickCount').textContent = clicks;

        document.querySelectorAll('.link').forEach(link => {
            link.addEventListener('click', () => {
                clicks++;
                localStorage.setItem('clicks', clicks);
                document.getElementById('clickCount').textContent = clicks;
            });
        });

        function avatarClick() {
            const avatar = document.querySelector('.avatar');
            avatar.style.transform = 'scale(1.3) rotate(360deg)';
            setTimeout(() => { avatar.style.transform = ''; }, 600);
        }

        // ИГРЫ
        let currentGame = null;

        function openGame(gameType) {
            const modal = document.getElementById('gameModal');
            const content = document.getElementById('gameContent');
            modal.classList.add('active');
            currentGame = gameType;

            if (gameType === 'clicker') {
                let count = parseInt(localStorage.getItem('clickerScore') || '0');
                content.innerHTML = `
                    <h2 class="modal-title">👆 КЛИКЕР</h2>
                    <div class="clicker-display" id="clickerCount">${count}</div>
                    <button class="clicker-btn" onclick="doClick()">КЛИК!</button>
                    <p style="margin-top: 15px; color: #888; font-size: 12px;">Рекорд: ${localStorage.getItem('clickerRecord') || '0'}</p>
                `;
            } else if (gameType === 'guess') {
                const target = Math.floor(Math.random() * 100) + 1;
                let attempts = 0;
                content.innerHTML = `
                    <h2 class="modal-title">🎯 УГАДАЙ ЧИСЛО</h2>
                    <p style="color: #888; margin-bottom: 15px;">Я загадал число от 1 до 100</p>
                    <input type="number" class="guess-input" id="guessInput" placeholder="Введи число" min="1" max="100">
                    <button class="guess-btn" onclick="makeGuess(${target}, 0)">Угадать</button>
                    <div class="guess-message" id="guessMessage"></div>
                `;
            }
        }

        function closeGame() {
            document.getElementById('gameModal').classList.remove('active');
            currentGame = null;
        }

        function doClick() {
            let count = parseInt(localStorage.getItem('clickerScore') || '0');
            count++;
            localStorage.setItem('clickerScore', count);
            document.getElementById('clickerCount').textContent = count;

            let record = parseInt(localStorage.getItem('clickerRecord') || '0');
            if (count > record) {
                localStorage.setItem('clickerRecord', count);
            }
        }

        function makeGuess(target, attempts) {
            attempts++;
            const input = document.getElementById('guessInput');
            const message = document.getElementById('guessMessage');
            const guess = parseInt(input.value);

            if (!guess || guess < 1 || guess > 100) {
                message.textContent = '❌ Введи число от 1 до 100';
                message.style.color = '#ff4444';
                return;
            }

            if (guess === target) {
                message.textContent = ` Угадал за ${attempts} попыток!`;
                message.style.color = '#00ff88';
                setTimeout(() => closeGame(), 2000);
            } else if (guess < target) {
                message.textContent = '⬆️ Больше!';
                message.style.color = '#00c8ff';
            } else {
                message.textContent = '⬇️ Меньше!';
                message.style.color = '#ff8800';
            }

            input.value = '';
            input.focus();
        }

        // Закрытие модалки по клику вне контента
        document.getElementById('gameModal').addEventListener('click', (e) => {
            if (e.target.id === 'gameModal') closeGame();
        });
    </script>
